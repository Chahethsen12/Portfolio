<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Chaheth Senevirathne</title>
    <meta name="description" content="The page you were looking for does not exist. Explore the portfolio homepage and recent work by Chaheth Senevirathne." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://chahethsenevirathne.com/404.html" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        --bg: #0b0b0b;
        --panel: #141414;
        --ink: #f3f3f1;
        --muted: #b8b8b5;
        --rule: rgba(255,255,255,0.14);
        --accent: #f3f3f1;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 22px;
        padding: clamp(32px, 5vw, 56px);
      }
      .eyebrow {
        margin: 0 0 18px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 112px);
        line-height: 0.9;
        letter-spacing: -0.05em;
      }
      p {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 999px;
        color: var(--bg);
        background: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
      a.secondary {
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--rule);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="eyebrow">404 Error</div>
      <h1>Page not found.</h1>
      <p>The page you were looking for may have moved, been removed, or never existed. Head back to the portfolio homepage or explore recent projects.</p>
      <div class="actions">
        <a href="/">Back to homepage</a>
        <a class="secondary" href="/projects.html">View projects</a>
      </div>
    </main>
  </body>
</html>
